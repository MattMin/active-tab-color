plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.13.1'
}

import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

group = 'com.matt'
version = '1.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://plugins.gradle.org/m2/' }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.1.7')
        pluginVerifier()
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

patchPluginXml {
    sinceBuild = '241.19416.15'
    untilBuild = provider { null }
    changeNotes = """
      <h3>1.1.0</h3>
      <ul>
        <li>Add configurable outline border width (1–6 logical pixels) for active tabs and rules.</li>
        <li>Add an option to let rule styles take priority over active tab styles.</li>
        <li>Add an optional theme accent dot to mark the selected tab in each editor split.</li>
        <li>Add JSON export and import for saved plugin settings, with configuration validation and error messages for invalid files. Imported settings are saved with Apply/OK.</li>
      </ul>
    """
}

test {
    useJUnitPlatform()
}

intellijPlatform {
    buildSearchableOptions = false

    pluginVerification {
        ides {
            recommended()
        }
    }
}
